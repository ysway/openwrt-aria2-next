
# You can use most aria2/aria2-next command-line options, replace '-' with '_'.
# eg. 'rpc-secret' ==> 'rpc_secret'
#
# We do not support all options at this time. But you can add any option
# with 'list extra_settings'.
#
# You can also add new config sections to define multi instance.
#
config aria2 'main'
	option enabled '0'
	option user 'aria2'
	option dir '/mnt/sda1/aria2-next'
	# /var is normally volatile. Use a persistent mounted config_dir for
	# session/resume recovery across reboots; copy old state before moving it.
	option config_dir '/var/etc/aria2-next'
	option bt_enable_lpd 'true'
	option enable_dht 'true'
	option follow_torrent 'true'
	option file_allocation 'none'
	option save_session_interval '30'
	# Resume checkpoints are separate from the session-file interval.
	# Minimum 1 second; legacy auto_save_interval=0 is no longer supported.
	# option state_save_interval '10'

	# aria2-next 2.6 and later support RPC token authentication only.
	# Username/password authentication was removed and is rejected by the
	# service wrapper so an old configuration cannot start unauthenticated.
	# option rpc_auth_method 'token'
	# option rpc_secret 'replace-with-a-long-random-secret'
	# aria2-next 3 no longer provides built-in RPC TLS. The service rejects
	# rpc_secure=true and RPC certificate/key settings, also in extra_settings.
	# For encrypted remote RPC use a TLS reverse proxy and keep rpc_secret.
	# option rpc_listen_all 'false'  # Loopback only, for a local reverse proxy.

	# Optional tuning for smaller routers:
	# option max_concurrent_downloads '1'
	# option split '2'
	# option max_connection_per_server '2'
	# disk_cache is retired upstream and does not bound version 3 memory use.

	# Additional request headers (without literal double quotes).
	# eg. list header 'Accept-Encoding: gzip'
	list header ''

	# Add BT trackers here.
	# eg. list bt_tracker 'http://tracker.example.com/announce'
	list bt_tracker ''

	# Add extra settings here.
	# eg. list extra_settings 'option=value'
	list extra_settings ''
