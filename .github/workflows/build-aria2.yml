name: Build aria2-next

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated targets, or "all"'
        required: false
        default: 'all'
        type: string
      sdk_version:
        description: 'Override the SDK version for every selected target'
        required: false
        default: ''
        type: string
      build_tests:
        description: 'Also compile the cross-built aria2 test executable'
        required: false
        default: false
        type: boolean
      upx:
        description: 'Apply UPX compression on supported targets'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Update the feed and GitHub Release after a manual build'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [build-aria2-next]

permissions:
  contents: read

concurrency:
  group: aria2-next-build-${{ github.ref }}
  cancel-in-progress: false

env:
  SOFTWARE_NAME: "aria2-next"
  ARTIFACT_DIR: "artifacts"
  OPENWRT_IPK_SDK: "24.10.7"
  OPENWRT_APK_SDK: "25.12.5"
  # Platforms not available in 24.10 SDK (build with 25.12 instead)
  ONLY_25: "riscv64_generic"

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build_config.outputs.matrix }}
      version: ${{ steps.build_config.outputs.version }}
      date: ${{ steps.build_config.outputs.date }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
          path: repo

      - name: Resolve Build Configuration
        id: build_config
        env:
          PLATFORM_SELECTION: ${{ github.event.client_payload.platforms || inputs.platforms || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish || 'false' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
            [ "$PUBLISH" = "true" ] &&
            [ "$PLATFORM_SELECTION" != "all" ]; then
            echo "ERROR: Publishing a partial matrix would replace the complete feed." >&2
            echo "Run all platforms or leave the publish option disabled." >&2
            exit 1
          fi

          MATRIX=$(bash repo/build_scripts/ci_matrix.sh "$PLATFORM_SELECTION")
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' \
            repo/aria2-next/CMakeLists.txt | head -1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine aria2-next version" >&2
            exit 1
          fi

          {
            echo "matrix=$MATRIX"
            echo "version=$VERSION"
            echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $MATRIX"
          echo "aria2-next version: $VERSION"

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
          path: repo

      - name: Restore Build Downloads
        uses: actions/cache@v6
        with:
          path: |
            repo/.cache/sources
            repo/.cache/pip
          key: aria2-next-inputs-${{ hashFiles('repo/build_scripts/versions.sh', 'repo/build_scripts/build_in_sdk.sh') }}

      - name: Prepare Directories
        run: |
          mkdir -p output repo/.cache/sources repo/.cache/pip \
            "${{ env.ARTIFACT_DIR }}/${{ matrix.platform }}"
          chmod -R 777 output repo/.cache

      - name: Determine SDK version
        id: sdk
        env:
          SDK_OVERRIDE: ${{ inputs.sdk_version }}
        run: |
          PLATFORM="${{ matrix.platform }}"
          if [ -n "$SDK_OVERRIDE" ]; then
            echo "version=$SDK_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using requested SDK $SDK_OVERRIDE"
          elif echo "${{ env.ONLY_25 }}" | grep -qw "$PLATFORM"; then
            echo "version=${{ env.OPENWRT_APK_SDK }}" >> "$GITHUB_OUTPUT"
            echo "Using 25.12 SDK (platform only available in 25.12)"
          else
            echo "version=${{ env.OPENWRT_IPK_SDK }}" >> "$GITHUB_OUTPUT"
            echo "Using ${{ env.OPENWRT_IPK_SDK }} SDK"
          fi

      - name: Pull OpenWrt SDK Docker Image
        run: |
          SDK_TAG="${{ matrix.platform }}-V${{ steps.sdk.outputs.version }}"
          echo "Pulling ghcr.io/openwrt/sdk:${SDK_TAG}"
          docker pull "ghcr.io/openwrt/sdk:${SDK_TAG}"

      - name: Build aria2-next in SDK Container
        env:
          ARIA2_BUILD_TESTS: ${{ inputs.build_tests || 'false' }}
          UPX_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.upx }}
        run: |
          docker run --rm --user root \
            -v "$(pwd)/repo:/work/repo:z" \
            -v "$(pwd)/output:/work/output:z" \
            -e PLATFORM="${{ matrix.platform }}" \
            -e OPENWRT_SDK_VERSION="${{ steps.sdk.outputs.version }}" \
            -e BUILD_VERSION="${GITHUB_SHA:0:8}" \
            -e SOURCE_CACHE_DIR="/work/repo/.cache/sources" \
            -e PIP_CACHE_DIR="/work/repo/.cache/pip" \
            -e ARIA2_BUILD_TESTS \
            -e UPX_ENABLED \
            -e BUILD_APK=no \
            -e TERM=xterm \
            "ghcr.io/openwrt/sdk:${{ matrix.platform }}-V${{ steps.sdk.outputs.version }}" \
            bash /work/repo/build_scripts/build_in_sdk.sh "${{ matrix.platform }}"

      - name: Collect Artifacts
        run: |
          PLATFORM="${{ matrix.platform }}"
          DEST="${{ env.ARTIFACT_DIR }}/${PLATFORM}"
          if [ -d "output/${PLATFORM}" ]; then
            cp -r "output/${PLATFORM}"/* "${DEST}/"
            echo "Artifacts collected for ${PLATFORM}:"
            ls -la "${DEST}/"
          else
            echo "ERROR: No output directory found for ${PLATFORM}"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-static-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_DIR }}/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

  package-apk:
    name: Build APK v3 packages
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Per-Platform Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aria2-next-static-*
          path: ${{ env.ARTIFACT_DIR }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
          path: repo

      - name: Pull OpenWrt APK SDK
        run: docker pull "ghcr.io/openwrt/sdk:x86_64-V${{ env.OPENWRT_APK_SDK }}"

      - name: Build and Verify APK v3 Packages
        run: |
          docker run --rm --user root \
            -v "$(pwd)/repo:/work/repo:ro" \
            -v "$(pwd)/${{ env.ARTIFACT_DIR }}:/work/artifacts" \
            "ghcr.io/openwrt/sdk:x86_64-V${{ env.OPENWRT_APK_SDK }}" \
            bash /work/repo/build_scripts/build_apk_artifacts.sh /work/artifacts

      - name: Upload Complete Artifact Set
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-static-all
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy Feed
    needs: [prepare, package-apk]
    if: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      RELEASE_TAG: v${{ needs.prepare.outputs.version }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: aria2-next-static-all
          path: ${{ env.ARTIFACT_DIR }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Deploy to Feed Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir deploy_workspace && cd deploy_workspace
          git init
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout --orphan feed

          # Copy feed template
          cp -r ../repo/feed_template/* ./
          touch .nojekyll

          # Generate one OPKG feed directory per target and retain the APK,
          # raw binary, and BUILDINFO files beside its package metadata.
          for dir in ../${{ env.ARTIFACT_DIR }}/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            platform="${name#aria2-next-static-}"
            bash ../repo/build_scripts/gen_feed.sh "$dir" "$platform"
          done

          bash ../repo/build_scripts/render_feed_index.sh \
            . "${{ env.RELEASE_VERSION }}" "${{ env.BUILD_DATE }}"

          git add -A
          git commit -m "Update feed: ${{ env.BUILD_DATE }}"
          git push origin feed --force

  release:
    name: Create Release
    needs: [prepare, package-apk]
    if: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: aria2-next-static-all
          path: ${{ env.ARTIFACT_DIR }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
          path: repo

      - name: Determine Upstream Release Tag
        id: get_release_tag
        run: |
          set -euo pipefail

          git -C repo/aria2-next fetch --force --tags origin
          RELEASE_TAG=$(git -C repo/aria2-next describe --tags --exact-match HEAD 2>/dev/null || true)

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG='${{ github.event.client_payload.tag }}'
          fi

          if [ -z "$RELEASE_TAG" ]; then
            SUBMODULE_SHA=$(git -C repo/aria2-next rev-parse --short=12 HEAD)
            RELEASE_TAG="aria2-next-${{ env.RELEASE_VERSION }}-${SUBMODULE_SHA}"
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using upstream release tag: $RELEASE_TAG"

      - name: Prepare Release Files and Notes
        id: prepare_release
        env:
          RELEASE_TAG: ${{ steps.get_release_tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Rename packages to include platform in filename for release
          for arch_dir in "${{ env.ARTIFACT_DIR }}"/*/; do
            [ -d "$arch_dir" ] || continue
            arch=$(basename "$arch_dir")
            platform="${arch#aria2-next-static-}"

            for ipk in "$arch_dir"/*.ipk; do
              [ -f "$ipk" ] || continue
              base=$(basename "$ipk")
              pkg_name="${base%%_*}"
              new_name="${pkg_name}_${{ env.RELEASE_VERSION }}_${platform}.ipk"
              mv "$ipk" "$arch_dir/$new_name"
            done
          done

          # Rename APK packages too
          for arch_dir in "${{ env.ARTIFACT_DIR }}"/*/; do
            [ -d "$arch_dir" ] || continue
            arch=$(basename "$arch_dir")
            platform="${arch#aria2-next-static-}"

            for apk in "$arch_dir"/*.apk; do
              [ -f "$apk" ] || continue
              new_name="aria2-next-static_${{ env.RELEASE_VERSION }}_${platform}.apk"
              mv "$apk" "$arch_dir/$new_name"
            done
          done

          # Rename raw binaries too, otherwise every upload collides on the same aria2-next asset name.
          for arch_dir in "${{ env.ARTIFACT_DIR }}"/*/; do
            [ -d "$arch_dir" ] || continue
            arch=$(basename "$arch_dir")
            platform="${arch#aria2-next-static-}"

            if [ -f "$arch_dir/aria2-next" ]; then
              mv "$arch_dir/aria2-next" "$arch_dir/aria2-next_${{ env.RELEASE_VERSION }}_${platform}"
            fi
          done

          # Publish one checksum manifest for the globally unique release assets.
          checksums="${{ env.ARTIFACT_DIR }}/SHA256SUMS"
          : > "$checksums"
          for arch_dir in "${{ env.ARTIFACT_DIR }}"/*/; do
            [ -d "$arch_dir" ] || continue
            for asset in "$arch_dir"/*; do
              [ -f "$asset" ] || continue
              asset_name=$(basename "$asset")
              case "$asset_name" in
                *.ipk|*.apk|aria2-next_*)
                  asset_sha256=$(sha256sum "$asset" | awk '{print $1}')
                  printf '%s  %s\n' "$asset_sha256" "$asset_name" >> "$checksums"
                  ;;
              esac
            done
          done
          sort -k2,2 -o "$checksums" "$checksums"

          # Build release table
          table="| Target Platform | IPK Package (OpenWrt ≤24.10) | APK Package (OpenWrt ≥25.12) | Raw Binary |\n|:--- |:--- |:--- |:--- |"
          rows=""

          for arch_dir in "${{ env.ARTIFACT_DIR }}"/*/; do
            [ -d "$arch_dir" ] || continue
            arch=$(basename "$arch_dir")
            platform="${arch#aria2-next-static-}"

            ipk_file="none"
            apk_file="none"
            bin_file="none"
            for candidate in "$arch_dir"/*.ipk; do
              [ -f "$candidate" ] || continue
              ipk_file=$(basename "$candidate")
              break
            done
            for candidate in "$arch_dir"/*.apk; do
              [ -f "$candidate" ] || continue
              apk_file=$(basename "$candidate")
              break
            done
            for candidate in "$arch_dir"/aria2-next_*; do
              [ -f "$candidate" ] || continue
              bin_file=$(basename "$candidate")
              break
            done

            if [ "$ipk_file" != "none" ]; then
              ipk_link="[${ipk_file}](${{ github.server_url }}/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ipk_file})"
            else
              ipk_link="N/A"
            fi

            if [ "$apk_file" != "none" ]; then
              apk_link="[${apk_file}](${{ github.server_url }}/${{ github.repository }}/releases/download/${RELEASE_TAG}/${apk_file})"
            else
              apk_link="N/A"
            fi

            if [ "$bin_file" != "none" ]; then
              bin_link="[${bin_file}](${{ github.server_url }}/${{ github.repository }}/releases/download/${RELEASE_TAG}/${bin_file})"
            else
              bin_link="N/A"
            fi

            rows="${rows}\n| ${platform} | ${ipk_link} | ${apk_link} | ${bin_link} |"
          done

          full_table="${table}${rows}"

          release_body="## Static aria2-next for OpenWrt
          #### Version: ${RELEASE_TAG}
          #### Build Date: ${{ env.BUILD_DATE }}
          ---

          Statically linked aria2-next build for OpenWrt using official SDK.
          - Compiled with official OpenWrt SDK.
          - UPX compression applied where supported.
          - Standard IPK, APK, and raw binary assets for direct installation.

          #### Architecture Check
          OpenWrt 24.10 or earlier:
          \`\`\`bash
          opkg print-architecture | awk 'NF==3 && \$3~/^[0-9]+\$/ {print \$2}' | tail -1
          \`\`\`
          OpenWrt 25.12 or later:
          \`\`\`bash
          cat /etc/apk/arch
          \`\`\`
          ---

          #### Download Links

          ${full_table}

          #### Checksums

          [SHA256SUMS](${{ github.server_url }}/${{ github.repository }}/releases/download/${RELEASE_TAG}/SHA256SUMS)
          "

          {
            echo "release_body<<EOF"
            printf '%b\n' "$release_body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_release_tag.outputs.tag }}
          name: "aria2-next-static ${{ env.RELEASE_VERSION }} (OpenWrt)"
          body: ${{ steps.prepare_release.outputs.release_body }}
          files: |
            ${{ env.ARTIFACT_DIR }}/**/*.ipk
            ${{ env.ARTIFACT_DIR }}/**/*.apk
            ${{ env.ARTIFACT_DIR }}/**/aria2-next_*
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS
